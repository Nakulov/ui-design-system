<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 12px; font: 12px/16px Inter, system-ui, sans-serif; color: var(--figma-color-text); background: var(--figma-color-bg); }
  h1 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  p { margin: 0 0 12px; color: var(--figma-color-text-secondary); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .load { margin-bottom: 12px; }
  label { display: block; margin-bottom: 4px; color: var(--figma-color-text-secondary); }
  input[type="url"] { box-sizing: border-box; width: 100%; margin-bottom: 8px; padding: 6px 8px; border: 1px solid var(--figma-color-border); border-radius: 6px; font: inherit; color: var(--figma-color-text); background: var(--figma-color-bg); }
  button:disabled { opacity: 0.4; cursor: default; }
  h2 { margin: 16px 0 4px; font-size: 12px; font-weight: 600; }
  ul { margin: 8px 0 0; padding-left: 16px; color: var(--figma-color-text-warning); }
  .status { margin-top: 12px; color: var(--figma-color-text-secondary); }
  button { padding: 6px 12px; border: 0; border-radius: 6px; font: inherit; font-weight: 500; color: var(--figma-color-text-onbrand); background: var(--figma-color-bg-brand); cursor: pointer; }
  table { width: 100%; margin-top: 12px; border-collapse: collapse; }
  th, td { padding: 4px 0; text-align: left; border-bottom: 1px solid var(--figma-color-border); }
  th { font-weight: 400; color: var(--figma-color-text-secondary); }
  td { text-align: right; font-variant-numeric: tabular-nums; }
  .imports { margin-top: 0; }
  .error { margin-top: 12px; padding: 8px; border-radius: 6px; color: var(--figma-color-text-danger); background: var(--figma-color-bg-danger-tertiary); }
  [hidden] { display: none; }
</style>
</head>
<body>
  <h1>UI Design System</h1>
  <p>Загрузите набор из <code>dev</code> с GitHub или откройте файл, собранный командой <code>python3 tools/bundle.py</code> (<code>build/bundle.json</code>), — например, из ветки задачи.</p>
  <label for="url">Адрес набора</label>
  <input id="url" type="url" spellcheck="false">
  <div class="actions load">
    <button id="github">Загрузить с GitHub</button>
    <button id="open">Открыть файл…</button>
  </div>
  <div class="actions">
    <button id="foundation" disabled>Построить foundation</button>
    <button id="components" disabled>Построить компоненты</button>
    <button id="samples" disabled>Отрисовать примеры</button>
    <button id="screens" disabled>Отрисовать экраны</button>
    <button id="documentation" disabled>Построить документацию</button>
  </div>
  <h2>В файле</h2>
  <table id="imports" class="imports"></table>
  <input id="file" type="file" accept=".json,application/json" hidden>
  <div id="error" class="error" hidden></div>
  <div id="status" class="status" hidden></div>
  <table id="summary" hidden></table>
  <div id="report" hidden></div>
  <!-- script -->
</body>
</html>
