name: validate

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Зависимости
        run: python3 -m pip install -r tools/requirements.txt
      - name: Контракты, значения, версии спецификаций
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/validate.py --base "origin/${{ github.base_ref }}"
          else
            python3 tools/validate.py
          fi
