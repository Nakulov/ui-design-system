[versions]
kotlin = "2.4.21"
kotlinx-serialization = "1.9.0"
kotestkit = "2.1.0"
kover = "0.9.11"
detekt = "2.0.0-alpha.6"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotestkit = { module = "io.github.nakulov:kotestkit", version.ref = "kotestkit" }
kotestkit-serialization = { module = "io.github.nakulov:kotestkit-serialization", version.ref = "kotestkit" }
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt" }
detekt-rules-ktlint-wrapper = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
